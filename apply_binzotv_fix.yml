      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Rebuild static Nuvio add-on from existing playlist
        run: python build_addon.py
      - name: Validate generated add-on
        run: python validate_addon.py
      - name: Commit and push fixes; remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/apply_binzotv_fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- update_playlist.py build_addon.py validate_addon.py README.md .gitignore .github/workflows/update.yml tests docs .github/workflows/apply_binzotv_fix.yml
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git diff --cached --stat
            git commit -m 'Fix IPTV filtering, Nuvio pagination and daily validations'
            git push origin HEAD:main
          fi
